name: CI Pipeline
on: [pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4 # TODO: Find the standard checkout action (v4)

      - name: Set up Python
        uses: actions/setup-python@v5 # TODO: Find the standard setup-python action (v5)
        with:
         python-version: '3.10'
         cache: 'pip'
          # TODO: Specify python-version (e.g., '3.10') and enable pip caching

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Formatting Check
        run: python -m black --check .

      - name: Run Linter
        run: python -m ruff check .

      - name: Run Tests
        run: python -m pytest